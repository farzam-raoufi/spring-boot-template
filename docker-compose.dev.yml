name: spring-boot-template-dev

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: template_database_name
      POSTGRES_USER: template_username
      POSTGRES_PASSWORD: template_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U template_username -d template_database_name"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata-dev: