spring.application.name=template
## ====== actuator ======
management.endpoints.web.exposure.include=*
## ====== PostgreSQL ======
spring.datasource.url=jdbc:postgresql://localhost:5432/template_database_name
spring.datasource.username=template_username
spring.datasource.password=template_password
spring.datasource.driver-class-name=org.postgresql.Driver
## ====== hibernate ======
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
## ====== JWT ======
# Base64-encoded 256-bit secret (generate with: openssl rand -base64 32)
app.jwt.secret=dGhpc2lzYXZlcnlzZWN1cmVzZWNyZXRrZXlmb3Jqd3R0b2tlbmluZ3NwcmluZ2Jvb3Q=
app.jwt.expiration-ms=86400000
# 30 days
app.jwt.refresh-expiration-ms=2592000000
# 7 days
app.jwt.refresh-rotate-ms=604800000
## ====== OAuth2 - Google ======
app.oauth2.google.client-id=567044155343-1dpe7l7l3ec6e27omt9gp1qjsgtn78gb.apps.googleusercontent.com
## ====== Notification - SMS (Faraz) ======
app.notification.sms.faraz.api-key=${FARAZ_SMS_API_KEY:}
app.notification.sms.faraz.sender-line=${FARAZ_SMS_SENDER_LINE:3000505}
## ====== Notification - Email (SMTP) ======
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.notification.email.from=${SMTP_FROM:${spring.mail.username}}